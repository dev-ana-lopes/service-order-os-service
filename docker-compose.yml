services:
  api:
    image: service-order-os-service:dev
    build: .
    container_name: service-order-os-service
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8001:8000"
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment: &app_environment
      APP_RUNTIME_MODE: real
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://os_service_user:os_service_password@postgres:5432/os_service_db}
      EXPECTED_DATABASE_NAME: ${EXPECTED_DATABASE_NAME:-os_service_db}
      EXPECTED_DATABASE_USERNAME: ${EXPECTED_DATABASE_USERNAME:-os_service_user}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_NAME: ${APP_NAME:-service-order-os-service}
      APP_VERSION: ${APP_VERSION:-2.1.0}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8001}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-SMTP}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8001}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-*}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@localhost}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PASSWORD_FILE: ${SMTP_PASSWORD_FILE:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USE_AUTH: ${SMTP_USE_AUTH:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      APPROVAL_TOKEN_SECRET: ${APPROVAL_TOKEN_SECRET:-dev-approval-secret-with-32-characters}
      APPROVAL_TOKEN_SECRET_FILE: ${APPROVAL_TOKEN_SECRET_FILE:-}
      APPROVAL_TOKEN_TTL_MINUTES: ${APPROVAL_TOKEN_TTL_MINUTES:-60}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-with-at-least-32-chars}
      JWT_SECRET_FILE: ${JWT_SECRET_FILE:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      CUSTOMER_JWT_SECRET: ${CUSTOMER_JWT_SECRET:-customer-dev-secret-with-at-least-32-char}
      CUSTOMER_JWT_SECRET_FILE: ${CUSTOMER_JWT_SECRET_FILE:-}
      CUSTOMER_JWT_ALGORITHM: ${CUSTOMER_JWT_ALGORITHM:-HS256}
      CUSTOMER_JWT_ISSUER: ${CUSTOMER_JWT_ISSUER:-service-order-auth-lambda/development}
      HEALTHCHECK_TIMEOUT_SECONDS: ${HEALTHCHECK_TIMEOUT_SECONDS:-5}
      RABBITMQ_URL: ${DOCKER_RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/%2F}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-service-order.events}
      RABBITMQ_ROUTING_KEY: ${RABBITMQ_ROUTING_KEY:-service-order.os}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-service-order.os.events}
      RABBITMQ_CONSUME_ROUTING_KEYS: ${RABBITMQ_CONSUME_ROUTING_KEYS:-service-order.billing,service-order.execution}
      MIGRATE_ON_STARTUP: "false"
      MIGRATE_MAX_ATTEMPTS: ${MIGRATE_MAX_ATTEMPTS:-30}
      MIGRATE_RETRY_SLEEP_SECONDS: ${MIGRATE_RETRY_SLEEP_SECONDS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    networks:
      - service-order-network
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    image: service-order-os-service:dev
    build: .
    container_name: service-order-os-worker
    command: ["python", "-m", "src.worker"]
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      <<: *app_environment
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - service-order-network
    volumes:
      - .:/app
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: service-order-os-postgres
    environment:
      POSTGRES_DB: os_service_db
      POSTGRES_USER: os_service_user
      POSTGRES_PASSWORD: os_service_password
    ports:
      - "5432:5432"
    networks:
      - service-order-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U os_service_user -d os_service_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: service-order-os-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - service-order-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: service-order-os-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - service-order-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:

networks:
  service-order-network:
    driver: bridge
